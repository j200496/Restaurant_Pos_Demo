    <div
          class="table-responsive border rounded p-2 mb-3"
          style="max-height: 350px; overflow-y: auto"
        >
          <table
            class="table table-striped table-bordered text-center align-middle"
          >
            <thead class="table-warning">
              <tr>
                <th *ngFor="let h of headers">{{ h }}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of data; let i = index">
                <td>{{d.nombre}}</td>
                <td>{{d.usuario}}</td>
                <td>{{d.clave}}</td>
                <td>{{d.rol}}</td>
                <td>{{d.estado}}</td>
                <td>
                    <div class="d-flex gap-2 justify-content-center">
                        <button class="btn btn-success" routerLink="/layout/updusuarios">Editar</button>
                        <button class="btn btn-danger">Borrar</button>
                    </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
