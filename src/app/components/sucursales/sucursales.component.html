<div class="container">

    <div class="row justify-content-start mt-4">
        <div class="col-7">
           <app-table (deleteEvent)="borrarsucursal($event)" [th]="th" titulo="Sucursales" [Categoria]="sucursales"></app-table>
        </div>
        <div class="col 5">
            <div class="shadow">
                <div class="card">
                    <div class="card-header bg-warning">
                             <h4 class="text-center text-white">Formulario</h4>
                    </div>
                     <div class="card-body">                 
                                <label for="Sucursal">Nombre</label>
                              <input class="form-control"type="text" [(ngModel)]="suc" id="Sucursal" placeholder="Nombre de sucursal">                      
                        </div>
                          <div class="card-footer">
                            <div class="row">
                                <div class="d-flex gap-2">
                                    <button class="btn btn-primary w-50" (click)="Agregar(suc)">Agregar</button>
                                    <button class="btn btn-danger w-50">Cancelar </button>
                                </div>
                            </div>
                           </div>
                </div>
            </div>
        </div>
    </div>
</div>
