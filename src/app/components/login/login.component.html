<div class="container">
    <div class="row justify-content-center">
        <div class="col-5 log">
            <div class="shadow">
                <div class="card">
                    <div class="card-header bg-warning">
                        <h4 class="text-center text-white">
                            Login
                        </h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <label for="usuario">Usuario</label>
                                <input type="text
                                " [(ngModel)]="user"class="form form-control mb-2" id="usuario">
                                <label for="cont">Contraseña</label>
                                <input type="password" class="form form-control mb-2" [(ngModel)]="clave" id="cont">
                                <button class="btn btn-primary w-100 mb-2"(click)="Login()">Login</button>
                                <button class="btn btn-danger w-100 mb-2">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
