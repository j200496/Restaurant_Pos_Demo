    <div
          class="table-responsive border rounded p-2 mb-3"
          style="max-height: 350px; overflow-y: auto"
        >
          <table
            class="table table-striped table-bordered text-center align-middle"
          >
            <thead class="table-warning">
              <tr>
                <th *ngFor="let h of headers">{{ h }}</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let d of data; let i = index">
                <td>{{ d.nombre }}</td>
                <td>{{ d.descripcion }}</td>
                <td>{{ d.montototal | currency }}</td>
                <td>{{ d.fecha }}</td>
                <td>{{ d.tipo }}</td>
                <td>{{d.estado? 'Al contado': 'Credito'}}</td>
            
              </tr>
            </tbody>
          </table>
          <div class="row justify-content-center mt-2">
            <div class="col-8">
                   <button class="btn btn-success w-100">Descargar</button>
            </div>
          </div>
        </div>
