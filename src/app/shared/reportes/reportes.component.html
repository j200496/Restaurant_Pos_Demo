<div class="container">
  <div class="row justify-content-center">
    <div class="col-5">
      <h1 class="mt-2">
        {{ titulo }}
      </h1>
    </div>
  </div>
  <div class="row justify-content-start">
    <div class="col-3">
      <button class="btn btn-success w-100"><i class="bi bi-funnel-fill"></i> Filtrar</button>
    </div>
    <div class="col-3">
      <input type="date" class="form form-control" name="" id="" />
    </div>
    <div class="col-3">
      <input type="date" class="form form-control" name="" id="" />
    </div>
  </div>
</div>
<div class="row justify-content-center mt-2">
  <div class="col-10">
    <div
      class="table-responsive border rounded p-2 mb-3"
      style="max-height: 400px; overflow-y: auto"
    >
      <table
        class="table table-striped table-bordered text-center align-middle"
      >
        <thead class="table-warning">
          <tr>
            <th *ngFor="let t of theader">{{ t }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let d of data">
            <th>{{ d.nombre }}</th>
            <th>{{ d.descripcion }}</th>
            <th>{{ d.categoria }}</th>
            <th>{{ d.cantidad }}</th>
            <th>{{ d.precio | currency}}</th>
          </tr>
        </tbody>
      </table>
      <div class="row justify-content-center">
        <div class="col-6">
          <button class="btn btn-success w-100"><i class="bi bi-file-earmark-arrow-down-fill"></i> Descargar</button>
        </div>
      </div>
    </div>
  </div>
</div>
